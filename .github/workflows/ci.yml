name: CI

# A branch and a pull request for it are the same commit, so running on every
# push as well as every pull request checked each commit twice and put two rows
# of identical results on every pull request. Pull requests are where the gate
# has to work, and main is what has to stay green after a merge; between them
# every commit that matters is covered exactly once.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

# Pushing again to a branch under review makes the previous run pointless. Let
# the new one cancel it rather than queue behind it. Never on main, where each
# run records whether that commit was good.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Only what the tests import. The real application also needs fastapi and
      # uvicorn, but installing those here would slow every run to prove
      # nothing: no test starts a server.
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install pytest numpy pillow
      - name: Run backend tests
        run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The launch scripts are how anyone starts this, so a syntax error in one
      # is a broken project even when every test passes.
      - name: Check the shell scripts parse
        run: for f in scripts/*.sh; do bash -n "$f" || exit 1; done
