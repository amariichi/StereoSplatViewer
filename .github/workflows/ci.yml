name: CI

# A branch and a pull request for it are the same commit, so running on every
# push as well as every pull request checked each commit twice and put two rows
# of identical results on every pull request. Pull requests are where the gate
# has to work, and main is what has to stay green after a merge; between them
# every commit that matters is covered exactly once.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

# Pushing again to a branch under review makes the previous run pointless. Let
# the new one cancel it rather than queue behind it. Never on main, where each
# run records whether that commit was good.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # From backend/uv.lock, which is the point of having one: if the lock and
      # pyproject.toml disagree, --locked fails here rather than someone finding
      # out months later on a fresh machine.
      - name: Install from the lock
        run: uv sync --project backend --group dev --locked
      - name: Run backend tests
        run: uv run --project backend python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The launch scripts are how anyone starts this, so a syntax error in one
      # is a broken project even when every test passes.
      - name: Check the shell scripts parse
        run: for f in scripts/*.sh; do bash -n "$f" || exit 1; done
