[project]
name = "stereosplatviewer-backend"
version = "1.0.2"
description = "FastAPI backend scaffold for StereoSplatViewer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "plyfile>=0.9",
    "piexif>=1.1.3",
]

# pytest was being installed by hand, which meant the test environment was
# whatever each machine happened to have. Declared here it is part of the lock
# like everything else.
[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
